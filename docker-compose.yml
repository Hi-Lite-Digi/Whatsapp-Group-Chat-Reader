services:
  listener:
    build:
      context: .
      dockerfile: Dockerfile
    image: mrrjestic-whatsapp-listener:latest
    container_name: mrrjestic-whatsapp-listener
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      AUTH_FOLDER: /app/runtime/auth
      MEDIA_FOLDER: /app/runtime/media
      DB_PATH: /app/runtime/data/whatsapp_bot.db
      BACKUP_DIR: /app/runtime/backups
    ports:
      - "${LISTEN_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./runtime:/app/runtime
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
